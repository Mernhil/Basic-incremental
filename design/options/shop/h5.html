<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1264">
<title>Shop option 5: Workbench</title>
<link rel="stylesheet" href="../_shared/mock.css">
<style>
/* H5 Workbench: master and detail. One list on the left, one big detail with a before/after and a quantity slider, a running total on the right */
.h5{--bg:#0c1c20;--panel:#12292f;--line:rgba(214,170,90,.5);--brass:#e2b45f;--teal:#59d6c8}
.h5 .mk-main{background:linear-gradient(180deg,#0c1c20,#08141a);color:#e1f3f1;font-family:'Barlow Semi Condensed',Outfit,sans-serif}
.h5 .pg{position:absolute;inset:0;display:grid;grid-template-columns:290px 1fr 250px}
.h5 .list{border-right:1px solid var(--line);padding:14px 0;overflow:hidden;background:rgba(0,0,0,.15)}
.h5 .grp{padding:6px 18px;font:700 13px 'Barlow Semi Condensed';color:#8fb9b4;letter-spacing:.04em;display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.h5 .grp b{color:var(--brass);font-size:15px}
.h5 .li{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:7px 18px;font-weight:600;font-size:16px;border-left:3px solid transparent}
.h5 .li small{display:block;font-size:12px;color:#8fb9b4;font-weight:500}
.h5 .li em{font-style:normal;font-weight:700;color:var(--brass)}.h5 .li em.no{color:#5c7f7b}
.h5 .li.sel{background:linear-gradient(90deg,rgba(226,180,95,.2),transparent);border-left-color:var(--brass);color:#fff}
.h5 .li.asc{margin:2px 10px 0;padding:9px 10px;border-radius:9px;background:linear-gradient(90deg,#3a2352,#12292f);box-shadow:inset 0 0 0 1px rgba(255,208,240,.5);border-left:0}
.h5 .det{position:relative;padding:26px 34px;display:grid;grid-template-rows:auto auto auto 1fr;gap:18px}.h5 .buyrow{align-self:end;white-space:nowrap}
.h5 .hdr{display:flex;gap:20px;align-items:center}
.h5 .emb{position:relative;width:120px;height:120px;display:grid;place-items:center;flex:none}
.h5 .emb::before{content:'';position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--brass),#fff3c4,var(--brass),#7a5a1e,var(--brass));mask:radial-gradient(closest-side,transparent 82%,#000 84%);-webkit-mask:radial-gradient(closest-side,transparent 82%,#000 84%);animation:h5s 20s linear infinite}
.h5 .emb::after{content:'';position:absolute;inset:10px;border-radius:50%;background:radial-gradient(#1c4a50,#0c1c20);box-shadow:inset 0 0 20px rgba(89,214,200,.3)}
.h5 .emb img{position:relative;z-index:2}
@keyframes h5s{to{rotate:360deg}}
.h5 .hdr h1{margin:0;font:700 40px/1 'Barlow Semi Condensed'}.h5 .hdr p{margin:6px 0 0;color:#9fd0cb;font-size:17px;font-weight:500}
.h5 .cmp{display:grid;grid-template-columns:1fr 60px 1fr;gap:0;align-items:center;text-align:center;padding:18px;border-radius:14px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.h5 .cmp div small{display:block;color:#8fb9b4;font-size:14px;font-weight:600}.h5 .cmp div b{font:700 50px/1.05 'Barlow Semi Condensed';color:#fff}
.h5 .cmp .to b{color:#8ff0a8;text-shadow:0 0 18px rgba(143,240,168,.5)}.h5 .cmp .ar{font-size:30px;color:var(--brass)}
.h5 .qty{display:grid;gap:10px}
.h5 .sl{position:relative;height:12px;border-radius:6px;background:#0a1417;box-shadow:inset 0 0 0 1px var(--line)}
.h5 .sl i{position:absolute;left:0;top:0;bottom:0;width:20%;border-radius:6px;background:linear-gradient(90deg,#b98a2a,var(--brass))}
.h5 .sl u{position:absolute;left:20%;top:50%;width:26px;height:26px;margin:-13px;border-radius:50%;background:#fff3c4;box-shadow:0 0 14px var(--brass),inset 0 0 0 3px var(--brass);text-decoration:none}
.h5 .tk{display:flex;justify-content:space-between;font-size:13px;color:#8fb9b4;font-weight:600}.h5 .tk b{color:#fff}
.h5 .seg{display:flex;gap:6px;align-items:center}.h5 .seg button{border:0;border-radius:8px;padding:6px 16px;font:700 16px 'Barlow Semi Condensed';background:#12292f;color:#9fd0cb;box-shadow:inset 0 0 0 1px var(--line)}.h5 .seg button.on{background:var(--brass);color:#1a1205}
.h5 .buyrow{display:flex;gap:16px;align-items:center;padding:14px 18px;border-radius:14px;background:var(--panel);box-shadow:inset 0 0 0 1px var(--line)}
.h5 .buyrow .c{font-size:15px;color:#9fd0cb;line-height:1.25}.h5 .buyrow .c b{display:flex;gap:6px;align-items:center;font:700 28px 'Barlow Semi Condensed';color:#fff}
.h5 .buyrow .c.bal b{color:#8fb9b4;font-size:22px}
.h5 .buy{margin-left:auto;border:0;border-radius:12px;padding:16px 46px;font:700 22px 'Barlow Semi Condensed';letter-spacing:.02em;color:#1a1205;background:linear-gradient(180deg,#f4d17f,#c9962f);box-shadow:0 0 28px rgba(226,180,95,.45),inset 0 0 0 1.5px #fff7}
.h5 .tot{border-left:1px solid var(--line);padding:18px 18px;background:rgba(0,0,0,.15);overflow:hidden}
.h5 .tot h3{margin:0 0 8px;font:700 16px 'Barlow Semi Condensed';color:var(--brass)}
.h5 .tr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px;font-weight:600}.h5 .tr b{color:#8ff0a8}.h5 .tr .d{color:#8ff0a8;font-size:12.5px;margin-left:6px}
.h5 .stream{display:none;position:absolute;inset:0;z-index:8;pointer-events:none}.h5.play .stream{display:block}
.h5 .stream img{position:absolute;filter:drop-shadow(0 0 8px var(--brass))}
.h5 .stream .tr2{position:absolute;height:3px;width:120px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--brass));rotate:var(--r)}
.h5 .done{display:none}.h5.play .done{display:block}
</style></head><body>
<div id="app"></div>
<script src="../_shared/mock.js"></script><script src="../_shared/shopdata.js"></script>
<script>
const li=(u,sel)=>`<div class="li ${sel?'sel':''}">${MK.img('cos-starlight-a',24)}<div>${u.n}<small>Level ${u.lv} of ${u.max}</small></div>${u.lv>=u.max?'<em class="no">Max</em>':`<em class="${SHOP.starlight<u.p?'no':''}">${u.p}</em>`}</div>`;
const sh=[['Card copies','from 5'],['Supplies','from 10'],['Exclusive','from 100']].map(([n,s])=>`<div class="li">${MK.img('coin-hexagon-prism',24)}<div>${n}<small>${s} shards</small></div><em>&rsaquo;</em></div>`).join('');
const sparks=[[40,150,18],[130,210,22],[220,270,26],[300,330,30]].map(([x,y,r])=>`<img class="pix" src="${MK.SPR}cos-starlight-a.png" width="26" height="26" style="left:${x+500}px;top:${y+40}px"><div class="tr2" style="left:${x+410}px;top:${y+60}px;--r:${r}deg"></div>`).join('');
MK.shell('shop',`<div class="pg">
 <nav class="list" aria-label="Shop sections"><div class="li asc">${MK.img('plaque-shop',26)}<div>Ascension<small>Ready: +14 Starlight</small></div><em>&rsaquo;</em></div>
  <div class="grp">STARLIGHT SHOP <b class="num">23</b></div>${SHOP.ups.map((u,i)=>li(u,i===2)).join('')}
  <div class="grp">SHARD SHOP <b class="num">87</b></div>${sh}</nav>
 <section class="det"><div class="hdr"><div class="emb">${MK.img('cos-starlight-a',64)}</div><div><h1>Starforged Edge</h1><p>+15% damage per level. Level 0 of 25.</p></div></div>
  <div class="cmp"><div><small>Damage bonus now</small><b class="num">+0%</b></div><div class="ar">&rarr;</div><div class="to"><small>After 3 levels</small><b class="num">+45%</b></div></div>
  <div class="qty"><div class="seg"><button>×1</button><button class="on">×3</button><button>×10</button><button>Max</button></div><div class="sl"><i></i><u></u></div><div class="tk"><span>Level 0</span><span><b>3 of 25 levels</b> &middot; up to 6 with your Starlight</span><span>Level 25</span></div></div>
  <div class="buyrow"><div class="c">Cost<b class="num">${MK.img('cos-starlight-a',26)}16 total</b></div><div class="c bal">After buying<b class="num">7 left</b></div><button class="buy">Buy 3 levels</button></div></section>
 <aside class="tot"><h3>Starlight bonuses now</h3>
  <div class="tr"><span>Logging</span><span><b class="num">+30%</b></span></div><div class="tr"><span>Mining</span><span class="num">+0%</span></div><div class="tr"><span>Damage</span><span class="num">+0%<span class="d done">+45%</span></span></div><div class="tr"><span>Card health</span><span class="num">+0%</span></div><div class="tr"><span>Boss crystals</span><span class="num">+0%</span></div><div class="tr"><span>Price growth</span><span class="num">0%</span></div><div class="tr"><span>Offline cap</span><span class="num">+4 h</span></div></aside>
 <div class="stream">${sparks}</div>
</div>`,{cls:'h5',play:'Play a purchase'});
</script></body></html>
