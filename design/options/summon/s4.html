<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=1264">
<title>Summon option 4: Rarity Ladder</title>
<link rel="stylesheet" href="../_shared/mock.css">
<style>
/* S4 Rarity Ladder: Gilded Tradition skin (ink navy, parchment, crimson, gold). Rates, pity and the result share one ladder */
.s4{--table-bg:#111a35;--table-glow:rgba(140,170,255,.13);--on-table:#e9eef7;--chrome-bg:#0a1024;--chrome-line:#b98a2a;--chrome-accent:#f1d27a;--chrome-ink:#f4ead2;--chrome-muted:#c9b98f;--chrome-active:rgba(241,210,122,.14);
  --ink:#3b1018;--paper:#f3e8c9;--paper2:#e8d9ae;--crim:#7d1c2b;--gold:#b98a2a;font-family:Outfit}
.s4 h2,.s4 h3,.s4 .serif{font-family:Marcellus,Georgia,serif;font-weight:400}
.s4 .grid{position:absolute;inset:18px 22px 18px;display:grid;grid-template-columns:330px 1fr 250px;gap:16px}
.s4 .sheet{position:relative;border-radius:10px;background:linear-gradient(180deg,var(--paper),var(--paper2));color:var(--ink);box-shadow:inset 0 0 0 2px var(--gold),inset 0 0 0 5px var(--paper),inset 0 0 0 6px rgba(185,138,42,.6),0 14px 30px rgba(0,0,0,.4)}
.s4 .ladder{padding:18px 20px 16px}
.s4 .ladder h2{margin:0;font-size:24px;color:var(--crim)}.s4 .ladder p{margin:2px 0 12px;font-size:12.5px;color:#6a4a40}
.s4 .rungs{position:relative;display:grid;gap:7px;padding-left:34px}
.s4 .rung{position:relative;display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center;padding:7px 12px;border-radius:8px;background:rgba(255,255,255,.35);box-shadow:inset 0 0 0 1px rgba(59,16,24,.2);font-weight:700;font-size:14.5px}
.s4 .rung::before{content:'';width:14px;height:14px;border-radius:50%;background:#d8cba3;box-shadow:inset 0 0 0 2px rgba(59,16,24,.3)}
.s4 .rung span{color:var(--ink)}.s4 .rung em{font-style:normal;font-weight:600;color:#6a4a40}
.s4 .rung.lit{background:color-mix(in srgb,var(--rc) 22%,#fff7);box-shadow:inset 0 0 0 2px var(--rc),0 0 16px color-mix(in srgb,var(--rc) 55%,transparent)}
.s4 .rung.lit::before{background:var(--rc);box-shadow:0 0 12px var(--rc)}
.s4 .rung.top{box-shadow:inset 0 0 0 2px var(--rc),0 0 26px var(--rc);transform:scale(1.03)}
.s4 .rung.top em{color:var(--crim)}
.s4 .pity{position:absolute;left:8px;top:0;bottom:0;width:14px}
.s4 .pity i{position:absolute;left:3px;bottom:0;width:8px;border-radius:4px;background:rgba(59,16,24,.2);height:100%}
.s4 .pity u{position:absolute;left:3px;bottom:0;width:8px;border-radius:4px;background:linear-gradient(0deg,#d89a2a,#f6d57a);height:78%;text-decoration:none;box-shadow:0 0 8px #f2a93b}
.s4 .pity b{position:absolute;left:-6px;top:6px;width:26px;height:26px;rotate:45deg;border-radius:4px;background:var(--paper);box-shadow:inset 0 0 0 2px var(--gold)}
.s4 .ptxt{margin-top:12px;padding:8px 10px;border-radius:8px;background:rgba(125,28,43,.1);font-size:13px;color:var(--ink);font-weight:600}
.s4 .ptxt b{color:var(--crim);font-size:20px;font-family:Marcellus,serif;font-weight:400}
.s4 .mid{display:grid;grid-template-rows:auto 1fr auto;gap:14px;justify-items:center}
.s4 .seg{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(10,16,36,.55);box-shadow:inset 0 0 0 1px var(--gold)}
.s4 .seg button{border:0;background:none;padding:7px 20px;border-radius:999px;font:400 16px Marcellus,serif;color:#e9dcb4}
.s4 .seg button[aria-pressed=true]{background:linear-gradient(180deg,#f6d57a,#c9962f);color:#2a1006}
.s4 .seal{position:relative;align-self:center;width:300px;height:300px;display:grid;place-items:center}
.s4 .seal .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#b98a2a,#f6d57a,#7d1c2b,#f6d57a,#b98a2a);mask:radial-gradient(closest-side,transparent 83%,#000 85%);-webkit-mask:radial-gradient(closest-side,transparent 83%,#000 85%);animation:s4s 30s linear infinite}
.s4 .seal .disc{position:absolute;inset:18px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#9b2639,#5a1220 70%);box-shadow:inset 0 0 0 3px #f1d27a,inset 0 0 40px rgba(0,0,0,.5),0 0 40px rgba(125,28,43,.6)}
@keyframes s4s{to{rotate:360deg}}
.s4 .seal>img{position:relative;z-index:2}.s4.play .seal>img{display:none}.s4 .seal .mk-card{display:none}
.s4 .buy{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:440px}
.s4 .btn{border:0;border-radius:10px;padding:11px 12px;text-align:center;font:400 20px Marcellus,serif;color:#2a1006;background:linear-gradient(180deg,#f6d57a,#c9962f);box-shadow:inset 0 0 0 2px #fff6,inset 0 -3px 0 rgba(90,50,0,.35)}
.s4 .btn small{display:flex;gap:6px;justify-content:center;align-items:center;font:700 12.5px Outfit;margin-top:2px;color:#4a2a0a}
.s4 .btn.two{background:linear-gradient(180deg,#9b2639,#6b1423);color:#fbe9bb;box-shadow:inset 0 0 0 2px #f1d27a,inset 0 -3px 0 rgba(0,0,0,.35)}.s4 .btn.two small{color:#f1d27a}
.s4 .hist{padding:16px 16px 14px}
.s4 .hist h3{margin:0 0 8px;font-size:19px;color:var(--crim)}
.s4 .chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.s4 .chips u{aspect-ratio:3/4;border-radius:6px;background:color-mix(in srgb,var(--rc) 40%,var(--paper));box-shadow:inset 0 0 0 2px var(--rc);display:grid;place-items:center;text-decoration:none}
.s4 .col{margin-top:14px;font-size:13px;font-weight:600}.s4 .col i{display:block;height:8px;border-radius:4px;background:rgba(59,16,24,.18);margin:6px 0;overflow:hidden}.s4 .col i u{display:block;height:100%;width:67%;background:var(--crim)}
.s4 .rt{margin-top:12px;font-size:12px;color:#6a4a40;line-height:1.4}
.s4.play .seal .ring,.s4.play .seal .disc{opacity:.25}
.s4.play .seal .mk-card{display:block;position:absolute;animation:s4in .6s both}
@keyframes s4in{from{scale:.6;opacity:0}}
.s4 .glow{display:none}.s4.play .glow{display:block;position:absolute;inset:-20px;background:radial-gradient(closest-side,rgba(246,213,122,.55),transparent 70%)}
</style></head><body>
<div id="app"></div>
<script src="../_shared/mock.js"></script>
<script>
const L=[['exotic','Exotic','0.2%'],['mythic','Mythic','0.5%'],['legendary','Legendary','2.3%'],['epic','Epic','6.1%'],['rare','Rare','22.7%'],['common','Common','68.2%']];
const lit=(r)=>['legendary','epic','rare','common'].includes(r);
const ladder=L.map(([k,n,v])=>`<div class="rung rc-${k} ${lit(k)?'lit':''} ${k==='legendary'?'top':''}"><span>${n}</span><em class="num">${v}</em></div>`).join('');
MK.shell('summon',`<div class="grid">
 <section class="sheet ladder" aria-label="Rates and pity"><h2>Card Portal</h2><p>Every pull climbs this ladder. Rates are per pull.</p>
  <div class="rungs"><div class="pity"><i></i><u></u></div>${ladder}</div>
  <div class="ptxt"><b class="num">20</b> pulls to a guaranteed Legendary.<br>Every ×10 holds a Rare or better.</div></section>
 <section class="mid"><div class="seg" role="group" aria-label="Portal"><button aria-pressed="true">Card Portal</button><button aria-pressed="false">Wardrobe Gate</button></div>
  <div class="seal"><div class="glow"></div><div class="ring"></div><div class="disc"></div>${MK.img('plaque-summon',128)}${MK.card('dawnblade_regent',{k:1.15,tag:'New!'})}</div>
  <div class="buy"><button class="btn">Pull ×1<small>${MK.img('coin-drop-silver',18)} 10 Summon Crystals</small></button><button class="btn two">Pull ×10<small>${MK.img('coin-drop-silver',18)} 100 Summon Crystals</small></button></div></section>
 <section class="sheet hist" aria-label="Recent pulls"><h3>Last ×10</h3>
  <div class="chips">${['common','common','rare','common','epic','common','common','rare','common','legendary'].map(r=>`<u class="rc-${r}">${MK.img('item-sword-'+r,20,24)}</u>`).join('')}</div>
  <div class="col">Cards found in this portal<i><u></u></i>8 of 12</div>
  <div class="rt">A duplicate adds a star to the card. Past the last star it becomes shards for the Shop.</div></section>
</div>`,{cls:'s4',play:'Play the climb'});
</script></body></html>
