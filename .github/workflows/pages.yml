# Builds the web app and deploys it to GitHub Pages. DISABLED on purpose: it only runs by hand
# (workflow_dispatch), and nothing turns Pages on. The public address is the owner's decision
# (DESIGN.md: iPhone web app). To use it: enable Pages (Settings > Pages > Source: GitHub Actions),
# then run this workflow from the Actions tab.
name: Web app to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out-web
      - id: deployment
        uses: actions/deploy-pages@v4
